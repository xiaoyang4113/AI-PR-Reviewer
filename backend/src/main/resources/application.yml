server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 10000


spring:
  application:
    name: ai-pr-reviewer
  profiles:
    active: dev

  # MySQL 数据源（密码等敏感信息在 application-dev.yml）
  datasource:
    url: jdbc:mysql://localhost:3306/ai_pr_reviewer?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: AIPrReviewerPool
      connection-test-query: SELECT 1
      validation-timeout: 5000

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.aiprreviewer.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: true
    lazy-loading-enabled: true
  global-config:
    db-config:
      id-type: auto

# 应用自定义配置（密钥等敏感信息在 application-dev.yml）
app:
  github:
    api-base: https://api.github.com
    token: ${GITHUB_TOKEN:}

  ai:
    api-base: https://api.deepseek.com/v1
    api-key: ${AI_API_KEY:}
    model: deepseek-v4-pro
    max-tokens: 4096
    temperature: 0.2
    max-diff-length: 8000

# 日志
logging:
  level:
    com.aiprreviewer: DEBUG
    org.springframework.web: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
