server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 10000

spring:
  application:
    name: ai-pr-reviewer

  # MySQL 数据源
  datasource:
    url: jdbc:mysql://localhost:3306/ai_pr_reviewer?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 你的数据库密码
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: AIPrReviewerPool
      connection-test-query: SELECT 1
      validation-timeout: 5000

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.aiprreviewer.model.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 应用自定义配置
app:
  github:
    api-base: https://api.github.com
    token:

  ai:
    api-base: https://api.deepseek.com/v1
    api-key: 你的DeepSeek_API_Key
    model: deepseek-v4-flash
    max-tokens: 4096
    temperature: 0.2
    max-diff-length: 8000

# 日志
logging:
  level:
    com.aiprreviewer: DEBUG
    org.springframework.web: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
